     CanDuet in-lesson video (T-009). Shown inside the app's video window (WebView2).
     The app opens  <this page>#url=<wss://…>&token=<LiveKit JWT>&name=<display name>
     The fragment never reaches a server; the page removes it from the address as soon as it loads.
     Video only: the microphone is never requested. Lesson audio stays on CanDuet's low-latency path.
     Either person can share one extra view (T-044): their screen or a window, or a second camera
     (hands at the keys, music on the stand). It is published as LiveKit's screen-share source. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>CanDuet video</title>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.9.1/dist/livekit-client.umd.js"
        integrity="sha384-ejH14wPQkwwyImo2LYdigxCruyGOymTSDatUhlPFHPulPcrMglpJOjRVTMYqZYqQ"
        crossorigin="anonymous"></script>
<style>
  /* Colours match tincanstudios.ca night palette (Source/TinCanTheme.h) */
  :root { --bg: #0a0f1e; --panel: #121a2e; --raised: #1a2440; --line: #3a4a75; --text: #e8ecf6; --muted: #b4bed6;
          --accent: #e5484d; --accent-strong: #d7263d; --danger: #e5645a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
               font: 14px/1.4 "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  #stage { position: absolute; inset: 0 0 52px 0; display: grid; place-items: center; }
  #remote { width: 100%; height: 100%; object-fit: contain; background: #000; }
  #self { position: absolute; right: 12px; bottom: 64px; width: 24%; max-width: 280px; min-width: 120px;
          aspect-ratio: 16 / 9; object-fit: cover; border-radius: 8px; border: 2px solid var(--panel);
          background: #000; transform: scaleX(-1); }
  #self.unmirrored { transform: none; }
  /* the other person's camera, small, while they share a view */
  #remoteCam { position: absolute; left: 12px; bottom: 64px; width: 24%; max-width: 280px; min-width: 120px;
               aspect-ratio: 16 / 9; object-fit: cover; border-radius: 8px; border: 2px solid var(--panel); background: #000; }
  #self[hidden], #remote[hidden], #remoteCam[hidden], #shareMenu[hidden], #sharing[hidden] { display: none; }
  #sharing { position: absolute; left: 12px; top: 12px; padding: 4px 10px; border-radius: 999px;
             background: var(--accent-strong); color: #fff; font-weight: 600; }
  #shareMenu { position: absolute; left: 12px; bottom: 58px; display: flex; flex-direction: column; gap: 4px;
               padding: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; min-width: 240px; }
  #shareMenu button { text-align: left; }
  #shareMenu button:disabled { color: var(--muted); }
  #share[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-strong); color: #fff; }
  #status { position: absolute; inset: 0 0 52px 0; display: grid; place-items: center; text-align: center;
            padding: 16px; color: var(--muted); font-size: 16px; pointer-events: none; }
  #bar { position: absolute; left: 0; right: 0; bottom: 0; height: 52px; display: flex; gap: 8px;
         align-items: center; padding: 0 12px; background: var(--panel); }
  button, select { font: inherit; color: var(--text); background: var(--raised); border: 1px solid var(--line);
                   border-radius: 6px; padding: 6px 12px; min-height: 34px; }
  button:hover, select:hover { border-color: var(--muted); }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button[aria-pressed="false"] { border-color: var(--danger); }
  select { max-width: 40%; }
  .spacer { flex: 1; }
  #who { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<main id="stage" aria-label="Lesson video">
  <video id="remote" autoplay playsinline muted hidden></video>
  <video id="remoteCam" autoplay playsinline muted hidden aria-label="The other person's camera"></video>
  <video id="self" autoplay playsinline muted hidden aria-label="Your camera"></video>
  <div id="sharing" role="status" hidden></div>
</main>
<div id="status" role="status" aria-live="polite">Starting video…</div>
<div id="bar">
  <button id="cam" type="button" aria-pressed="true">Camera on</button>
  <select id="camera" aria-label="Camera"></select>
  <button id="share" type="button" aria-haspopup="menu" aria-expanded="false" aria-pressed="false">Share…</button>
  <button id="mirror" type="button" aria-pressed="true" title="Flip your own preview (others always see you the right way round)">Mirror me</button>
  <span class="spacer"></span>
  <span id="who"></span>
</div>
<div id="shareMenu" role="menu" aria-label="Share" hidden>
  <button id="shareScreen" type="button" role="menuitem">Share my screen or a window</button>
  <div id="secondCams"></div>
</div>
<script>
"use strict";
(function () {
  const LK = window.LivekitClient;
  const $ = (id) => document.getElementById(id);
  const remoteEl = $("remote"), remoteCamEl = $("remoteCam"), selfEl = $("self"), statusEl = $("status");

  // read and immediately forget the connection details
  const params = new URLSearchParams(location.hash.slice(1));
  history.replaceState(null, "", location.pathname + location.search);
  const sfuUrl = params.get("url") || "";
  const token = params.get("token") || "";
  const myName = (params.get("name") || "").slice(0, 80);

  // small read-only state for support and automated checks
  const state = window.canduetVideo = { phase: "starting", remoteName: "", remoteVideo: false, localVideo: false, error: "",
                                        localShare: "", remoteShare: "" };  // share: "", "screen" or "camera"

  function setStatus(text) {
    statusEl.textContent = text;
    statusEl.hidden = !text;
  }
  function fail(phase, text) {
    state.phase = phase; state.error = text;
    setStatus(text);
  }

  if (!LK) return fail("error", "Video couldn't load. Check your internet connection, then close and reopen the video window.");
  if (!/^wss:\/\//.test(sfuUrl) && !/^ws:\/\/(localhost|127\.0\.0\.1)(:\d+)?(\/|$)/.test(sfuUrl) || !token) {
    return fail("error", "This video link isn't complete. Leave the lesson and press Join again in My lessons.");
  }

  const room = new LK.Room({
    adaptiveStream: true,
    dynacast: true,
    videoCaptureDefaults: { resolution: LK.VideoPresets.h720.resolution },
    publishDefaults: { simulcast: true, videoCodec: "vp8" },
  });

  // show one track in a video element, detaching whatever it showed before
  function put(el, track) {
    if (el._track === track) return;
    if (el._track) el._track.detach(el);
    el._track = track || null;
    if (track) track.attach(el);
    el.hidden = !track;
  }

  const SHARE = LK.Track.Source.ScreenShare;
  const SECOND_CAMERA = "second-camera";  // track name of a second camera published as a shared view

  // the other person's camera and shared view: a shared view goes large, their camera small
  function showRemote() {
    let cam = null, share = null;
    room.remoteParticipants.forEach((p) => {
      p.trackPublications.forEach((pub) => {
        if (pub.kind !== "video" || !pub.track || pub.isMuted) return;
        if (pub.source === SHARE) { if (!share) share = { p, track: pub.track, kind: pub.trackName === SECOND_CAMERA ? "camera" : "screen" }; }
        else if (!cam) cam = { p, track: pub.track };
      });
    });
    const main = share || cam;
    put(remoteEl, main && main.track);
    put(remoteCamEl, share && cam ? cam.track : null);
    state.remoteVideo = !!cam;
    state.remoteShare = share ? share.kind : "";
    if (main) {
      state.remoteName = main.p.name || "";
      $("who").textContent = main.p.name ? "With " + main.p.name : "";
      setStatus("");
    } else {
      const others = room.remoteParticipants.size;
      setStatus(others ? "The other person's camera is off." : "Waiting for the other person to turn on video…");
    }
  }

  // ---- sharing a view (T-044) ----
  let shareTrack = null;  // a second camera we publish ourselves

  function updateShareUI() {
    const kind = state.localShare;
    $("share").textContent = kind ? "Stop sharing" : "Share…";
    $("share").setAttribute("aria-pressed", String(!!kind));
    $("share").setAttribute("aria-haspopup", kind ? "false" : "menu");
    $("sharing").textContent = kind === "screen" ? "You're sharing your screen" : kind === "camera" ? "You're sharing your second camera" : "";
    $("sharing").hidden = !kind;
  }

  function closeShareMenu() {
    $("shareMenu").hidden = true;
    $("share").setAttribute("aria-expanded", "false");
  }

  async function openShareMenu() {
    let cams = [];
    try { cams = await LK.Room.getLocalDevices("videoinput", false); } catch (_) {}
    const active = room.getActiveDevice("videoinput");
    const others = cams.filter((c) => c.deviceId !== active);
    const items = others.map((c, i) => {
      const b = document.createElement("button");
      b.type = "button"; b.setAttribute("role", "menuitem");
      b.textContent = "Share second camera: " + (c.label || "Camera " + (i + 2));
      b.addEventListener("click", () => { closeShareMenu(); startSecondCamera(c.deviceId); });
      return b;
    });
    if (!items.length) {
      const b = document.createElement("button");
      b.type = "button"; b.disabled = true;
      b.textContent = "Second camera: plug one in to share it";
      items.push(b);
    }
    $("secondCams").replaceChildren(...items);
    $("shareMenu").hidden = false;
    $("share").setAttribute("aria-expanded", "true");
    $("shareScreen").focus();
  }

  async function startScreenShare() {
    try {
      await room.localParticipant.setScreenShareEnabled(true, { audio: false, selfBrowserSurface: "exclude" });
      if (room.localParticipant.getTrackPublication(SHARE)) state.localShare = "screen";
    } catch (e) {
      // NotAllowedError: the person closed the picker; nothing to say
      if (!e || e.name !== "NotAllowedError") setStatus("Your screen couldn't be shared. Try again, or share a single window.");
    }
    updateShareUI();
  }

  async function startSecondCamera(deviceId) {
    try {
      shareTrack = await LK.createLocalVideoTrack({ deviceId, resolution: LK.VideoPresets.h720.resolution });
      shareTrack.mediaStreamTrack.addEventListener("ended", stopShare);  // camera unplugged
      await room.localParticipant.publishTrack(shareTrack, { source: SHARE, name: SECOND_CAMERA, simulcast: true });
      state.localShare = "camera";
    } catch (e) {
      if (shareTrack) { shareTrack.stop(); shareTrack = null; }
      setStatus("That camera couldn't start. Close other apps that use it, or pick another one.");
    }
    updateShareUI();
  }

  async function stopShare() {
    try {
      if (shareTrack) {
        const t = shareTrack; shareTrack = null;
        await room.localParticipant.unpublishTrack(t);
        t.stop();
      } else {
        await room.localParticipant.setScreenShareEnabled(false);
      }
    } catch (_) {}
    state.localShare = "";
    updateShareUI();
  }

  $("share").addEventListener("click", () => {
    if (state.localShare) return stopShare();
    if ($("shareMenu").hidden) openShareMenu(); else closeShareMenu();
  });
  $("shareScreen").addEventListener("click", () => { closeShareMenu(); startScreenShare(); });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !$("shareMenu").hidden) { closeShareMenu(); $("share").focus(); }
  });
  document.addEventListener("pointerdown", (e) => {
    if (!$("shareMenu").hidden && !$("shareMenu").contains(e.target) && e.target !== $("share")) closeShareMenu();
  });

  async function startCamera(deviceId) {
    try {
      await room.localParticipant.setCameraEnabled(true, deviceId ? { deviceId } : undefined);
      const pub = room.localParticipant.getTrackPublication(LK.Track.Source.Camera);
      if (pub && pub.track) { pub.track.attach(selfEl); selfEl.hidden = false; state.localVideo = true; }
      $("cam").textContent = "Camera on"; $("cam").setAttribute("aria-pressed", "true");
      await listCameras();
    } catch (e) {
      state.localVideo = false;
      selfEl.hidden = true;
      $("cam").textContent = "Camera off"; $("cam").setAttribute("aria-pressed", "false");
      setStatus(e && e.name === "NotAllowedError"
        ? "CanDuet isn't allowed to use your camera. Allow it in the prompt or in Windows Settings › Privacy › Camera."
        : "Your camera couldn't start. Close other apps that use it, or pick another camera below.");
    }
  }

  async function listCameras() {
    const sel = $("camera");
    const cams = await LK.Room.getLocalDevices("videoinput", false);
    const active = room.getActiveDevice("videoinput");
    sel.replaceChildren(...cams.map((c, i) => {
      const o = document.createElement("option");
      o.value = c.deviceId; o.textContent = c.label || "Camera " + (i + 1);
      o.selected = c.deviceId === active;
      return o;
    }));
    sel.hidden = cams.length < 2;
  }

  $("camera").addEventListener("change", (e) => {
    try { localStorage.setItem("canduet.camera", e.target.value); } catch (_) {}
    room.switchActiveDevice("videoinput", e.target.value).catch(() => {});
  });
  $("cam").addEventListener("click", async () => {
    const on = $("cam").getAttribute("aria-pressed") === "true";
    if (on) {
      await room.localParticipant.setCameraEnabled(false);
      selfEl.hidden = true; state.localVideo = false;
      $("cam").textContent = "Camera off"; $("cam").setAttribute("aria-pressed", "false");
    } else {
      await startCamera(room.getActiveDevice("videoinput"));
    }
  });
  $("mirror").addEventListener("click", () => {
    const on = $("mirror").getAttribute("aria-pressed") !== "true";
    $("mirror").setAttribute("aria-pressed", String(on));
    selfEl.classList.toggle("unmirrored", !on);
    try { localStorage.setItem("canduet.mirror", on ? "1" : "0"); } catch (_) {}
  });
  try {
    if (localStorage.getItem("canduet.mirror") === "0") $("mirror").click();
  } catch (_) {}

  room
    .on(LK.RoomEvent.TrackSubscribed, showRemote)
    .on(LK.RoomEvent.TrackUnsubscribed, showRemote)
    .on(LK.RoomEvent.LocalTrackUnpublished, (pub) => {
      // also fires when the person presses the browser's own "Stop sharing"
      if (pub.source === SHARE) {
        if (shareTrack) { shareTrack.stop(); shareTrack = null; }
        state.localShare = ""; updateShareUI();
      }
    })
    .on(LK.RoomEvent.TrackMuted, showRemote)
    .on(LK.RoomEvent.TrackUnmuted, showRemote)
    .on(LK.RoomEvent.ParticipantConnected, showRemote)
    .on(LK.RoomEvent.ParticipantDisconnected, showRemote)
    .on(LK.RoomEvent.Reconnecting, () => { state.phase = "reconnecting"; setStatus("Video connection lost. Reconnecting…"); })
    .on(LK.RoomEvent.Reconnected, () => { state.phase = "connected"; showRemote(); })
    .on(LK.RoomEvent.Disconnected, () => { if (state.phase !== "error") fail("ended", "Video has ended. Your lesson audio is not affected."); });

  setStatus("Connecting video…");
  room.connect(sfuUrl, token)
    .then(async () => {
      state.phase = "connected";
      showRemote();
      let saved = null;
      try { saved = localStorage.getItem("canduet.camera"); } catch (_) {}
      await startCamera(saved || undefined);
    })
    .catch(() => fail("error", "Video couldn't connect. Your lesson audio still works. Leave and rejoin the lesson to try again."));

  window.addEventListener("pagehide", () => room.disconnect());
})();
</script>
</body>
</html>
