# One CanDuet media server (D-025): connection server + audio relay, LiveKit video, Caddy for TLS.
# Settings live in .env (copy env.example); run ./configure.sh once, then `docker compose up -d`.
# Every service uses host networking: media needs wide UDP port ranges and the real public address.
services:
  canduet-server:
    # Pinned to a commit tag in .env, never :main, so a server only changes when .env does.
    # Building here instead needs a full repo checkout: compose.build.yaml.
    image: ${CANDUET_SERVER_IMAGE:?set CANDUET_SERVER_IMAGE in .env (a :<commit> tag)}
    pull_policy: missing
    command: ["--relay-ip", "${PUBLIC_IP:?run configure.sh}", "--port", "${AOO_PORT:-10998}",
              "--relay-ports", "${RELAY_PORT_FIRST:-40000}-${RELAY_PORT_LAST:-40999}"]
    environment:
      CANDUET_GROUP_SECRET: ${GROUP_SECRET:?run configure.sh}   # only rooms-worker-signed lesson groups (T-048)
    network_mode: host
    restart: unless-stopped
    ulimits:
      nofile: 8192                       # one socket per relayed participant (T-048)
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  livekit:
    image: ${LIVEKIT_IMAGE:-livekit/livekit-server:v1.13.9}
    command: ["--config", "/etc/livekit.yaml"]
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./generated/livekit.yaml:/etc/livekit.yaml:ro

  caddy:
    image: ${CADDY_IMAGE:-livekit/caddyl4:v2.11.3}   # Caddy with the layer4 module, as LiveKit's generator uses
    command: ["run", "--config", "/etc/caddy.yaml", "--adapter", "yaml"]
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./generated/caddy.yaml:/etc/caddy.yaml:ro
      - ./caddy_data:/data

  # Test join service (stand-in for the rooms-worker): `docker compose --profile test-api up -d`.
  # Needs test-api/redeem.py (scripts/tincan-mock-redeem.py) and test-api/index.html (video-page).
  test-api:
    profiles: [test-api]
    image: ${PYTHON_IMAGE:-python:3.12-slim}
    command: ["python", "-I", "/app/redeem.py"]
    network_mode: host
    restart: unless-stopped
    read_only: true
    user: "65534:65534"
    volumes:
      - ./test-api:/app:ro
    environment:
      MOCK_PORT: "8788"
      MOCK_TICKETS: ${MOCK_TICKETS:-}
      MOCK_REQUIRE_TICKETS: "1"         # redeem.py refuses to start without tickets
      MOCK_SERVER: ${RTC_DOMAIN}:${AOO_PORT:-10998}
      MOCK_VIDEO_URL: wss://${RTC_DOMAIN}
      MOCK_VIDEO_KEY: ${LIVEKIT_API_KEY}
      MOCK_VIDEO_SECRET: ${LIVEKIT_API_SECRET}
      MOCK_VIDEO_TTL: "86400"
      MOCK_VIDEO_PAGE: /app/index.html
      MOCK_ROOM_SEED: ${MOCK_ROOM_SEED}
      MOCK_GROUP_SECRET: ${GROUP_SECRET}
